[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: fast tests without external services
    integration: tests using persistence or service boundaries
    api: FastAPI endpoint tests
    agent: agent pipeline tests
    security: security regression tests
    strix: Strix-specific tests
    frontend: frontend tests
    e2e: browser tests
    live: manual tests against legal targets
    slow: performance tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning